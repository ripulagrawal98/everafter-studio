<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Live Wedding Website Demo | Wedavique</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/templates/gallery.css"><link rel="stylesheet" href="/wedding-site.css"><script defer src="/wedding-site.js"></script>
  <script defer src="/music-player.js"></script></head><body><header><a class="brand" href="/templates/">wedavique</a><nav class="nav"><a href="/templates/">All templates</a><a class="primary" id="customizeTop" href="/">Customize this</a></nav></header><main><section class="demo-head"><div class="eyebrow">Live invitation preview</div><h1 id="themeName">Blossom</h1><p>Explore the full invitation, switch designs and try mobile or desktop.</p><div class="demo-bar"><label for="themeSelect">Template</label><select id="themeSelect"><option value="blossom">Blossom</option><option value="heritage">Royal Heritage</option><option value="minimal">Modern Minimal</option></select><button class="secondary" id="mobile" type="button" aria-pressed="true">Mobile</button><button class="secondary" id="desktop" type="button" aria-pressed="false">Desktop</button><a class="primary" id="customize" href="/">Use this template</a></div></section><p class="demo-help">Demo names and dates are illustrative · Scroll to explore all sections</p><div id="device" class="device phone"><div id="invitation"></div></div></main><footer><a href="/templates/">← Explore all wedding website templates</a></footer><script>window.addEventListener('DOMContentLoaded',()=>{const themes={blossom:['Blossom','Anaya','Kabir'],heritage:['Royal Heritage','Meera','Arjun'],minimal:['Modern Minimal','Diya','Rohan']};const select=document.getElementById('themeSelect'),params=new URLSearchParams(location.search);select.value=themes[params.get('theme')]?params.get('theme'):'blossom';function render(){const theme=select.value,info=themes[theme];document.getElementById('themeName').textContent=info[0];document.title=info[0]+' Wedding Website Demo | Wedavique';document.getElementById('customize').href='/builder/?theme='+theme;document.getElementById('customizeTop').href='/builder/?theme='+theme;history.replaceState(null,'','?theme='+theme);document.getElementById('invitation').innerHTML=window.EverafterSite.render({theme,partner1:info[1],partner2:info[2],tagline:'A little destiny, a lifetime of love.',message:'With the blessings of our families, we invite you to celebrate our new beginning.',story:'Two paths, one beautiful journey. We cannot wait to make memories with the people we love.',travelNote:'Your presence will make our celebration even more special.',sections:{story:true,gallery:true,venue:true},photos:[],events:[{name:'Haldi',date:'2026-12-10',time:'11:00',venue:'Garden Courtyard, Jaipur'},{name:'Sangeet',date:'2026-12-10',time:'19:00',venue:'Royal Ballroom, Jaipur'},{name:'Wedding',date:'2026-12-11',time:'19:00',venue:'Palace Gardens, Jaipur'}]}, {preview:true});}select.addEventListener('change',render);for(const size of ['mobile','desktop'])document.getElementById(size).addEventListener('click',()=>{document.getElementById('device').className='device '+(size==='mobile'?'phone':'desktop');for(const s of ['mobile','desktop'])document.getElementById(s).setAttribute('aria-pressed',String(s===size));});render();});</script></body></html>
